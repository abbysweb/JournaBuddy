# Alembic Configuration for JournaBuddy
# https://alembic.sqlalchemy.org/

[alembic]
# Path to migration scripts directory
script_location = alembic

# Synchronous DB URL used by Alembic CLI (psycopg2 driver, not asyncpg)
# This is overridden dynamically in alembic/env.py using environment variables
sqlalchemy.url = postgresql://postgres:password@localhost:5432/journabuddy

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
